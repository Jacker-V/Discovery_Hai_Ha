<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tập Dượt Song Song - Ô Chữ "Giải Mã Hải Hà"</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      background: #020612;
      display: flex;
      flex-direction: column;
    }

    .split-header {
      background: #07152b;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(59, 130, 246, 0.3);
      z-index: 10;
    }

    .split-header h1 {
      font-size: 1.05rem;
      color: #fbbf24;
      font-weight: 800;
    }

    .split-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      height: calc(100vh - 46px);
    }

    .frame-wrapper {
      position: relative;
      height: 100%;
      border-right: 2px solid rgba(59, 130, 246, 0.3);
      display: flex;
      flex-direction: column;
    }

    .frame-label {
      background: rgba(10, 25, 52, 0.9);
      padding: 4px 12px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #93c5fd;
      border-bottom: 1px solid rgba(59, 130, 246, 0.2);
    }

    iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="split-header">
    <div style="display: flex; align-items: center; gap: 10px;">
      <a href="index.html" class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.8rem;">← Về Trang Chủ</a>
      <h1>CHẾ ĐỘ TẬP DƯỢT SONG SONG (SPLIT-SCREEN PREVIEW)</h1>
    </div>
    <div style="font-size: 0.8rem; color: #94a3b8;">
      💡 Thao tác bên phải (Admin) sẽ phản hồi tức thì sang bên trái (Stage)
    </div>
  </div>

  <div class="split-container">
    <div class="frame-wrapper">
      <div class="frame-label">🖥️ MÀN HÌNH TRÌNH CHIẾU MÁY CHIẾU (STAGE VIEW)</div>
      <iframe src="stage.html" id="stage-frame"></iframe>
    </div>

    <div class="frame-wrapper" style="border-right: none;">
      <div class="frame-label">🎛️ BÀN ĐIỀU KHIỂN MC & KỸ THUẬT (ADMIN CONTROL)</div>
      <iframe src="admin.html" id="admin-frame"></iframe>
    </div>
  </div>
</body>
</html>
